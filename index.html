<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ivanalicioustreats — Order Online</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap');
:root{--bg:#faf6ef;--fg:#5a2a35;--card:#ffffff;--primary:#c65f74;--primary-fg:#fff;--secondary:#fbe4e9;--muted:#8a5b66;--accent:#c89b3c;--border:rgba(90,42,53,.16);}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--fg);
background-color:#fff;
background-image:
  repeating-linear-gradient(0deg, rgba(242,151,172,0.55) 0, rgba(242,151,172,0.55) 10px, transparent 10px, transparent 20px),
  repeating-linear-gradient(90deg, rgba(242,151,172,0.55) 0, rgba(242,151,172,0.55) 10px, transparent 10px, transparent 20px);
background-blend-mode:multiply;
}
.itt{max-width:720px;margin:0 auto;background:transparent;position:relative;min-height:100vh;}
.itt-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(255,255,255,.6);backdrop-filter:blur(2px);z-index:2;}
.itt-brand{font-family:'Caveat',cursive;font-weight:700;font-size:26px;display:flex;align-items:center;gap:8px;}
.itt-dot{width:9px;height:9px;border-radius:50%;background:var(--primary);display:inline-block;}
.itt-cartbtn{display:flex;align-items:center;gap:8px;background:var(--fg);color:var(--bg);border:none;border-radius:999px;padding:9px 16px;font-size:14px;font-weight:700;cursor:pointer;}
.itt-count{background:var(--primary);color:#fff;border-radius:999px;min-width:19px;height:19px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;padding:0 4px;}
.itt-hero{padding:36px 20px 12px;text-align:center;}
.itt-tag{color:var(--primary);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px;}
.itt-h1{font-family:'Caveat',cursive;font-size:42px;font-weight:700;line-height:1.1;margin:0 0 10px;}
.itt-sub{color:var(--muted);font-size:15px;line-height:1.6;max-width:40ch;margin:0 auto;}
.itt-body{padding:8px 20px 40px;}
.itt-cat h3{font-size:24px;font-weight:700;margin:24px 0 2px;letter-spacing:.03em;}
.itt-cat p{color:var(--muted);font-size:13px;margin:0 0 12px;}
.itt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;}
.itt-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;}
.itt-emoji{aspect-ratio:1;background:var(--secondary);display:flex;align-items:center;justify-content:center;font-size:44px;}
.itt-cbody{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1;}
.itt-cname{font-family:'Caveat',cursive;font-size:20px;font-weight:700;line-height:1.2;}
.itt-cdesc{color:var(--muted);font-size:12px;line-height:1.4;flex:1;}
.itt-crow{display:flex;align-items:center;justify-content:space-between;margin-top:4px;}
.itt-price{font-weight:700;font-size:15px;}
.itt-add{width:32px;height:32px;border-radius:50%;background:var(--fg);color:var(--bg);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;}
.itt-add:active{transform:scale(.9);}
.itt-footer{border-top:1px solid var(--border);padding:20px 18px;text-align:center;font-size:12.5px;color:var(--muted);background:rgba(255,255,255,.6);}
.itt-drawer{display:none;background:#fff5f7;min-height:100vh;}
.itt-drawer.on{display:block;}
.itt-dhead{padding:18px 20px;border-bottom:2px dashed var(--fg);position:relative;}
.itt-dhead h2{font-family:'Caveat',cursive;font-size:23px;font-weight:700;margin:0;}
.itt-dhead .sub{font-size:11px;letter-spacing:.08em;color:var(--muted);}
.itt-close{position:absolute;right:16px;top:16px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--fg);}
.itt-ditems{padding:12px 20px;max-width:520px;margin:0 auto;}
.itt-line{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px dotted var(--border);}
.itt-lname{font-family:'Caveat',cursive;font-size:18px;font-weight:700;}
.itt-lprice{font-size:12px;color:var(--muted);}
.itt-qty{display:flex;align-items:center;gap:8px;}
.itt-qty button{width:24px;height:24px;border-radius:50%;border:1px solid var(--fg);background:var(--card);cursor:pointer;font-size:13px;}
.itt-empty{padding:40px 8px;text-align:center;color:var(--muted);font-size:14px;}
.itt-field{margin-top:12px;}
.itt-field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;}
.itt-field input,.itt-field select,.itt-field textarea{width:100%;border-radius:10px;border:1px solid var(--border);background:var(--card);padding:9px 11px;font-size:14px;box-sizing:border-box;font-family:inherit;}
.itt-dfoot{border-top:2px dashed var(--fg);padding:16px 20px 40px;max-width:520px;margin:0 auto;}
.itt-drow{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:3px;}
.itt-total{display:flex;justify-content:space-between;font-weight:700;font-size:17px;margin:8px 0 14px;}
.itt-checkout{width:100%;border:none;border-radius:999px;background:var(--primary);color:#fff;padding:13px;font-size:14.5px;font-weight:700;cursor:pointer;}
.itt-checkout:disabled{background:var(--secondary);color:var(--muted);cursor:not-allowed;}
.itt-code{display:flex;gap:6px;margin-bottom:12px;}
.itt-code input{flex:1;}
.itt-code button{border-radius:10px;border:1px solid var(--fg);background:var(--card);padding:0 14px;font-size:13px;font-weight:700;cursor:pointer;}
.itt-msg{font-size:12px;margin-top:5px;}
.itt-sent{padding:28px 22px;text-align:center;max-width:480px;margin:0 auto;}
.itt-check{width:52px;height:52px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:24px;}
.itt-sent pre{white-space:pre-wrap;font-size:12px;text-align:left;background:var(--card);border:1px dashed var(--fg);border-radius:10px;padding:12px;margin:16px 0;max-height:220px;overflow-y:auto;font-family:monospace;}
.itt-btn2{display:block;width:100%;text-align:center;border-radius:999px;padding:12px;font-size:14px;font-weight:700;margin-top:10px;cursor:pointer;border:none;text-decoration:none;box-sizing:border-box;}
</style>
</head>

var IG='ivanalicioustreats';
var CATS=[{cat:'cupcakes',title:'ᑕᑌᑭᑕᗩKᗴ',sub:'Made fresh to order, quality ingredients always.'},{cat:'cookies',title:'ᑕOOKIᗴ',sub:'Loaded, drizzled, and baked to make you smile.'}];
var cart={}, showForm=false, sent=false, codeApplied=false, codeError='', orderText='';
var form={name:'',phone:'',fulfil:'Pickup',addr:'',notes:'',code:''};
function fmt(n){return 'KES '+n.toLocaleString();}
function lines(){var r=[];for(var id in cart){var p=PRODUCTS.find(function(x){return x.id===id;});if(p)r.push({product:p,qty:cart[id]});}return r;}
function totals(){var count=0,total=0;lines().forEach(function(l){count+=l.qty;total+=l.product.price*l.qty;});return{count:count,total:total};}
function cupcakeSubtotal(){var s=0;lines().forEach(function(l){if(l.product.cat==='cupcakes')s+=l.product.price*l.qty;});return s;}

function renderMenu(){
  var el=document.getElementById('menu'); el.innerHTML='';
  CATS.forEach(function(c){
    var wrap=document.createElement('div'); wrap.className='itt-cat';
    var h=document.createElement('h3'); h.textContent=c.title; wrap.appendChild(h);
    var p=document.createElement('p'); p.textContent=c.sub; wrap.appendChild(p);
    var grid=document.createElement('div'); grid.className='itt-grid';
    PRODUCTS.filter(function(x){return x.cat===c.cat;}).forEach(function(prod){
      var card=document.createElement('div'); card.className='itt-card';
      var media = prod.img ? '<img src="'+prod.img+'" alt="'+prod.name+'" style="width:100%;height:100%;object-fit:cover;">' : prod.emoji;
      card.innerHTML='<div class="itt-emoji" role="img" aria-label="'+prod.name+'">'+media+'</div>'+
        '<div class="itt-cbody"><div class="itt-cname">'+prod.name+'</div><div class="itt-cdesc">'+prod.desc+'</div>'+
        '<div class="itt-crow"><span class="itt-price">'+fmt(prod.price)+'</span>'+
        '<button class="itt-add" aria-label="Add '+prod.name+'" data-id="'+prod.id+'">+</button></div></div>';
      grid.appendChild(card);
    });
    wrap.appendChild(grid); el.appendChild(wrap);
  });
  el.querySelectorAll('.itt-add').forEach(function(btn){
    btn.addEventListener('click',function(){cart[btn.dataset.id]=(cart[btn.dataset.id]||0)+1;renderAll();});
  });
}

function buildOrderText(t){
  var msg='New order — ivanalicioustreats\n\n';
  lines().forEach(function(l){msg+=l.qty+'x '+l.product.name+' — '+fmt(l.product.price*l.qty)+'\n';});
  if(t.discount>0){msg+='\nSubtotal: '+fmt(t.total)+'\nDiscount (M.OLISE): -'+fmt(t.discount)+'\nTotal: '+fmt(t.final)+'\n\n';}
  else{msg+='\nTotal: '+fmt(t.final)+'\n\n';}
  msg+='Name: '+form.name+'\nPhone: '+form.phone+'\nFulfilment: '+form.fulfil;
  if(form.fulfil==='Delivery')msg+='\nAddress: '+form.addr;
  if(form.notes)msg+='\nNotes: '+form.notes;
  return msg;
}
function copyText(text){
  try{
    var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.top='-9999px';
    document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);return true;
  }catch(e){return false;}
}

function renderDrawer(){
  var t=totals();
  var discount=codeApplied?Math.min(10,cupcakeSubtotal()):0;
  var final=t.total-discount;
  var inner=document.getElementById('drawerInner');

  if(sent){
    inner.innerHTML='<div class="itt-dhead"><h2>Your order</h2><div class="sub">ORDER TICKET</div><button class="itt-close" id="closeX" aria-label="Close">✕</button></div>'+
    '<div class="itt-sent"><div class="itt-check">✓</div>'+
    '<div style="font-family:\'Caveat\',cursive;font-size:24px;font-weight:700;">Order copied</div>'+
    '<p style="color:var(--muted);font-size:13px;margin-top:8px;">Instagram is opening in a new tab. Paste it into the chat with <b>@'+IG+'</b> to confirm.</p>'+
    '<pre>'+orderText+'</pre>'+
    '<button class="itt-btn2" id="copyAgain" style="background:var(--primary);color:#fff;">📋 Copy order</button>'+
    '<a class="itt-btn2" href="https://ig.me/m/'+IG+'" target="_blank" rel="noopener noreferrer" style="background:var(--fg);color:var(--bg);">💬 Open Instagram</a>'+
    '<button class="itt-btn2" id="doneBtn" style="background:none;color:var(--muted);text-decoration:underline;">Done — start a new order</button></div>';
    document.getElementById('closeX').onclick=closeDrawer;
    document.getElementById('copyAgain').onclick=function(){copyText(orderText);};
    document.getElementById('doneBtn').onclick=function(){cart={};sent=false;showForm=false;codeApplied=false;codeError='';orderText='';form={name:'',phone:'',fulfil:'Pickup',addr:'',notes:'',code:''};closeDrawer();};
    return;
  }

  var itemsHtml='';
  if(lines().length===0){
    itemsHtml='<div class="itt-empty">Your ticket is empty — add something delicious.</div>';
  }else{
    lines().forEach(function(l){
      itemsHtml+='<div class="itt-line"><div style="flex:1;"><div class="itt-lname">'+l.product.name+'</div><div class="itt-lprice">'+fmt(l.product.price)+' each</div></div>'+
      '<div class="itt-qty"><button data-id="'+l.product.id+'" data-d="-1" aria-label="Remove one">−</button><span style="width:18px;text-align:center;font-size:14px;">'+l.qty+'</span><button data-id="'+l.product.id+'" data-d="1" aria-label="Add one">+</button></div></div>';
    });
  }
  if(showForm && t.count>0){
    itemsHtml+='<div class="itt-field"><label for="fName">Full name</label><input id="fName" value="'+form.name+'" placeholder="Your name"/></div>'+
    '<div class="itt-field"><label for="fPhone">Phone number</label><input id="fPhone" type="tel" value="'+form.phone+'" placeholder="07XX XXX XXX"/></div>'+
    '<div class="itt-field"><label for="fFulfil">Fulfilment</label><select id="fFulfil"><option value="Pickup"'+(form.fulfil==='Pickup'?' selected':'')+'>Pickup</option><option value="Delivery"'+(form.fulfil==='Delivery'?' selected':'')+'>Delivery</option></select></div>'+
    (form.fulfil==='Delivery'?'<div class="itt-field"><label for="fAddr">Delivery address</label><textarea id="fAddr" rows="2" placeholder="Estate, building, landmark">'+form.addr+'</textarea></div>':'')+
    '<div class="itt-field"><label for="fNotes">Notes (optional)</label><textarea id="fNotes" rows="2" placeholder="Any allergies, timing requests, etc.">'+form.notes+'</textarea></div>';
  }

  var footHtml='';
  if(t.count>0){
    footHtml+='<div class="itt-field" style="margin-top:0;"><label for="fCode">Discount code</label><div class="itt-code"><input id="fCode" value="'+form.code+'" placeholder="Enter code"/><button id="applyCode">Apply</button></div>';
    if(codeApplied)footHtml+='<div class="itt-msg" style="color:var(--accent);">✓ Code applied — '+fmt(discount)+' off cupcakes.</div>';
    if(codeError)footHtml+='<div class="itt-msg" style="color:var(--primary);">'+codeError+'</div>';
    footHtml+='</div>';
  }
  if(discount>0){
    footHtml+='<div class="itt-drow"><span>Subtotal</span><span>'+fmt(t.total)+'</span></div><div class="itt-drow" style="color:var(--accent);font-weight:700;"><span>Discount (cupcakes)</span><span>-'+fmt(discount)+'</span></div>';
  }
  footHtml+='<div class="itt-total"><span>Total</span><span>'+fmt(final)+'</span></div>';
  var label = t.count===0?'Add items to order':(showForm?'Copy and open Instagram':'Checkout');
  footHtml+='<button class="itt-checkout" id="checkoutBtn" '+(t.count===0?'disabled':'')+'>'+label+'</button>';
  if(showForm && t.count>0)footHtml+='<p style="text-align:center;font-size:12px;color:var(--muted);margin-top:10px;">We\'ll copy your order and open Instagram — just paste it in the message box.</p>';

  inner.innerHTML='<div class="itt-dhead"><h2>Your order</h2><div class="sub">ORDER TICKET</div><button class="itt-close" id="closeX" aria-label="Close">✕</button></div>'+
  '<div class="itt-ditems">'+itemsHtml+'</div><div class="itt-dfoot">'+footHtml+'</div>';

  document.getElementById('closeX').onclick=closeDrawer;
  inner.querySelectorAll('.itt-qty button').forEach(function(b){
    b.onclick=function(){var id=b.dataset.id,d=parseInt(b.dataset.d,10);cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];renderAll();};
  });
  if(showForm && t.count>0){
    var fName=document.getElementById('fName'); if(fName)fName.oninput=function(e){form.name=e.target.value;};
    var fPhone=document.getElementById('fPhone'); if(fPhone)fPhone.oninput=function(e){form.phone=e.target.value;};
    var fFulfil=document.getElementById('fFulfil'); if(fFulfil)fFulfil.onchange=function(e){form.fulfil=e.target.value;renderDrawer();};
    var fAddr=document.getElementById('fAddr'); if(fAddr)fAddr.oninput=function(e){form.addr=e.target.value;};
    var fNotes=document.getElementById('fNotes'); if(fNotes)fNotes.oninput=function(e){form.notes=e.target.value;};
  }
  var fCode=document.getElementById('fCode');
  if(fCode){fCode.oninput=function(e){form.code=e.target.value;codeApplied=false;codeError='';};}
  var applyBtn=document.getElementById('applyCode');
  if(applyBtn){applyBtn.onclick=function(){
    if(form.code.trim().toLowerCase()!=='m.olise'){codeApplied=false;codeError="That code isn't valid.";renderDrawer();return;}
    if(cupcakeSubtotal()<=0){codeApplied=false;codeError='This code only works on cupcakes — add a cupcake to use it.';renderDrawer();return;}
    codeApplied=true;codeError='';renderDrawer();
  };}
  var checkoutBtn=document.getElementById('checkoutBtn');
  if(checkoutBtn){checkoutBtn.onclick=function(){
    if(!showForm){showForm=true;renderDrawer();return;}
    if(!form.name.trim()||!form.phone.trim()){alert('Please add your name and phone number so we can confirm your order.');return;}
    if(form.fulfil==='Delivery'&&!form.addr.trim()){alert('Please add a delivery address.');return;}
    var tt=totals();
    var disc=codeApplied?Math.min(10,cupcakeSubtotal()):0;
    orderText=buildOrderText({total:tt.total,discount:disc,final:tt.total-disc});
    copyText(orderText);
    sent=true;
    window.open('https://ig.me/m/'+IG,'_blank','noopener,noreferrer');
    renderDrawer();
  };}
}

function renderAll(){
  var t=totals();
  document.getElementById('cartCount').textContent=t.count;
  renderDrawer();
}
function openDrawer(){document.getElementById('menuPage').style.display='none';document.getElementById('drawer').classList.add('on');renderDrawer();window.scrollTo(0,0);}
function closeDrawer(){document.getElementById('drawer').classList.remove('on');document.getElementById('menuPage').style.display='block';window.scrollTo(0,0);}

document.getElementById('openCart').addEventListener('click',openDrawer);

renderMenu();
renderAll();
})();
</script>
</body>
</html>
